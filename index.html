<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PupLog</title>
    <style>
      :root {
        --bg: #f9f8f5; --card: #ffffff; --ink: #111111; --ink-2: #4f4e4a; --muted: #85837c;
        --line: #eceae3; --chip: #f1efe8; --accent: #0f7a5c; --accent-soft: #e1f5ee;
        --good: #0ca30c; --good-soft: #e3f4e3; --warn: #fab219; --warn-soft: #fdf1d6; --crit: #d03b3b; --crit-soft: #f9e1e1;
        --heat-0: #eceae3; --heat-1: #c6eadc; --heat-2: #86d0b2; --heat-3: #3ba57f; --heat-4: #0b6e50;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #151513; --card: #1f1f1c; --ink: #f2f1ec; --ink-2: #c9c7bf; --muted: #95938b;
          --line: #2f2e2a; --chip: #2a2925; --accent: #5fcfa6; --accent-soft: #173a30;
          --good-soft: #193419; --warn-soft: #3a2f12; --crit-soft: #3d1c1c;
          --heat-0: #2a2925; --heat-1: #1d4537; --heat-2: #24694f; --heat-3: #33986f; --heat-4: #7fdcb6;
        }
      }
      :root[data-theme="dark"] {
        --bg: #151513; --card: #1f1f1c; --ink: #f2f1ec; --ink-2: #c9c7bf; --muted: #95938b;
        --line: #2f2e2a; --chip: #2a2925; --accent: #5fcfa6; --accent-soft: #173a30;
        --good-soft: #193419; --warn-soft: #3a2f12; --crit-soft: #3d1c1c;
        --heat-0: #2a2925; --heat-1: #1d4537; --heat-2: #24694f; --heat-3: #33986f; --heat-4: #7fdcb6;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg); color: var(--ink); line-height: 1.35;
        padding: 16px 16px 40px; max-width: 560px; margin: 0 auto;
      }
      .card { background: var(--card); border-radius: 20px; padding: 16px; margin-bottom: 12px; }
      h2 { font-size: 13px; font-weight: 650; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; margin: 26px 4px 10px; }
      h3 { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
      .muted { color: var(--muted); }
      .small { font-size: 13px; }
      .tiny { font-size: 12px; }
      .num { font-variant-numeric: tabular-nums; }
      .status { font-size: 12px; color: var(--muted); text-align: center; margin: 4px 0 10px; }
      .status:empty { display: none; }
      .empty { font-size: 14px; color: var(--muted); padding: 4px 0; }

      /* Profile */
      .profile { display: flex; gap: 14px; align-items: center; }
      .photo { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: var(--chip);
               display: flex; align-items: center; justify-content: center; font-size: 34px; }
      .profile .who { flex: 1; min-width: 0; }
      .profile h1 { font-size: 24px; font-weight: 700; }
      .profile .meta { font-size: 14px; color: var(--ink-2); margin-top: 2px; }
      .profile .bday { font-size: 13px; color: var(--muted); margin-top: 4px; }
      .score { text-align: center; flex-shrink: 0; }
      .score .label { font-size: 11px; color: var(--muted); margin-top: 2px; }

      /* Rings */
      .rings { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
      .ring-tile { background: var(--card); border-radius: 18px; padding: 12px 8px; text-align: center; }
      .ring-tile .name { font-size: 13px; margin-top: 6px; }
      .ring-tile .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
      .ring-text { font-size: 15px; font-weight: 650; fill: var(--ink); font-variant-numeric: tabular-nums; }
      .ring-text.big { font-size: 18px; }

      /* Lists */
      .rows { list-style: none; }
      .rows li { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
      .rows li:first-child { border-top: none; padding-top: 0; }
      .rows li:last-child { padding-bottom: 0; }
      .rows .emoji { font-size: 20px; width: 26px; text-align: center; flex-shrink: 0; }
      .rows .body { flex: 1; min-width: 0; }
      .rows .line { font-size: 15px; }
      .rows .detail { font-size: 13px; color: var(--ink-2); margin-top: 2px; overflow-wrap: anywhere; }
      .rows .side { font-size: 12px; color: var(--muted); white-space: nowrap; text-align: right; }
      details summary { cursor: pointer; font-size: 13px; color: var(--muted); margin-top: 12px; }
      details[open] summary { margin-bottom: 10px; }

      .badge { display: inline-flex; gap: 4px; align-items: center; font-size: 12px; padding: 2px 8px; border-radius: 999px;
               background: var(--chip); color: var(--ink); white-space: nowrap; flex-shrink: 0; }
      .badge.good { background: var(--good-soft); }
      .badge.warn { background: var(--warn-soft); }
      .badge.crit { background: var(--crit-soft); }

      /* Small multiples: 7-day bars */
      .multiples { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .mini { background: var(--card); border-radius: 18px; padding: 12px; min-width: 0; }
      .mini .head { display: flex; justify-content: space-between; gap: 6px; font-size: 13px; margin-bottom: 8px; }
      .bars { position: relative; height: 64px; display: flex; gap: 4px; align-items: flex-end; }
      .bar-col { flex: 1; height: 100%; display: flex; align-items: flex-end; }
      .bar { width: 100%; background: var(--accent); opacity: 0.55; border-radius: 4px 4px 0 0; }
      .bar.today { opacity: 1; }
      .goal-line { position: absolute; left: 0; right: 0; border-top: 1.5px dashed var(--muted); }
      .bar-labels { display: flex; gap: 4px; margin-top: 4px; }
      .bar-labels span { flex: 1; text-align: center; font-size: 10px; color: var(--muted); }

      /* Heatmap */
      .heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, auto); gap: 3px; }
      .heat div { aspect-ratio: 1; border-radius: 3px; background: var(--heat-0); }
      .heat .l1 { background: var(--heat-1); } .heat .l2 { background: var(--heat-2); }
      .heat .l3 { background: var(--heat-3); } .heat .l4 { background: var(--heat-4); }
      .heat .blank { background: transparent; }
      .heat .today { outline: 1.5px solid var(--ink); }
      .legend { display: flex; gap: 3px; align-items: center; justify-content: flex-end; font-size: 11px; color: var(--muted); margin: 8px 0 4px; }
      .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

      /* Tables */
      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      th { text-align: left; font-weight: 500; font-size: 12px; color: var(--muted); padding: 0 0 6px; }
      td { padding: 7px 0; border-top: 1px solid var(--line); }
      tr:first-child td { border-top: none; }
      td.r, th.r { text-align: right; padding-left: 8px; }

      /* Supplies meter */
      .meter { height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; margin: 8px 0 6px; }
      .meter div { height: 100%; background: var(--accent); border-radius: 999px; }
      .meter.warn div { background: var(--warn); }

      .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .stat { background: var(--card); border-radius: 18px; padding: 14px; }
      .stat .big { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
      .stat .label { font-size: 13px; color: var(--ink-2); margin-top: 4px; }

      svg text { font-family: inherit; }
      .axis { font-size: 10px; fill: var(--muted); }
      footer { font-size: 12px; color: var(--muted); text-align: center; margin-top: 24px; }
    </style>
  </head>
  <body>
    <div class="status" id="status">Loading…</div>
    <div id="app"></div>

    <script>
      // Your Apps Script web app URL (Deploy → Manage deployments → Web app URL, ends in /exec).
      const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzSsm7EoVpXxlSWSLDYi9xvjLYK62EEMAu2lxmg284GPA37CTWo9pMNwmc8waLcs7E/exec";
      const REFRESH_MS = 60 * 1000;
      const STORE = "puplog-view-key";
      const NS = "http://www.w3.org/2000/svg";
      const DAY = 864e5;

      // ---------- helpers ----------
      function el(tag, cls, ...kids) {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        kids.flat().forEach(k => { if (k != null && k !== false) n.append(k instanceof Node ? k : String(k)); });
        return n;
      }
      function svg(tag, attrs, ...kids) {
        const n = document.createElementNS(NS, tag);
        for (const k in attrs) n.setAttribute(k, attrs[k]);
        kids.flat().forEach(k => { if (k != null) n.append(k instanceof Node ? k : String(k)); });
        return n;
      }
      function store(fn) { try { return fn(); } catch (e) { return null; } }
      const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;

      function timeOf(d) { return new Date(d).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); }
      function dateOf(d, opts) { return new Date(d).toLocaleDateString([], opts || { month: "short", day: "numeric", year: "numeric" }); }
      const shortDate = d => dateOf(d, { month: "short", day: "numeric" });
      function dayKeyDate(key) { const [y, m, d] = key.split("-").map(Number); return new Date(y, m - 1, d); }
      function minutesToTime(m) { return timeOf(new Date(2000, 0, 1, Math.floor(m / 60), m % 60)); }
      function ago(iso) {
        const m = Math.floor((Date.now() - new Date(iso)) / 60000);
        if (m < 1) return "just now";
        if (m < 60) return `${m}m ago`;
        const h = Math.floor(m / 60);
        if (h < 24) return m % 60 ? `${h}h ${m % 60}m ago` : `${h}h ago`;
        return `${Math.floor(h / 24)}d ago`;
      }
      function daysUntil(iso) {
        const a = new Date(); a.setHours(0, 0, 0, 0);
        const b = new Date(iso); b.setHours(0, 0, 0, 0);
        return Math.round((b - a) / DAY);
      }
      function dueBadge(iso, warnDays) {
        const n = daysUntil(iso);
        if (n < 0) return el("span", "badge crit", "⚠️", `Overdue ${plural(-n, "day")}`);
        if (n === 0) return el("span", "badge warn", "⏰", "Due today");
        if (n <= warnDays) return el("span", "badge warn", "⏰", `Due in ${plural(n, "day")}`);
        return el("span", "badge", `Due in ${plural(n, "day")}`);
      }
      function amountText(amount, unit) {
        if (amount === "" || amount == null) return "";
        return unit ? `${amount} ${unit}` : String(amount);
      }
      const quoted = note => note ? `“${note}”` : "";

      // Only needed if the dashboard is set to private: the family link looks like .../#key=...
      // Everything after # stays in the browser and is never sent to the web host.
      function getViewKey() {
        const m = location.hash.match(/key=([^&]+)/);
        if (m) {
          const key = decodeURIComponent(m[1]);
          store(() => localStorage.setItem(STORE, key));
          history.replaceState(null, "", location.pathname + location.search);
          return key;
        }
        return store(() => localStorage.getItem(STORE));
      }

      // ---------- charts ----------
      function ring(frac, size, stroke, met, label, big) {
        const r = (size - stroke) / 2, c = 2 * Math.PI * r, mid = size / 2;
        const s = svg("svg", { width: size, height: size, viewBox: `0 0 ${size} ${size}`, role: "img", "aria-label": label },
          svg("circle", { cx: mid, cy: mid, r, fill: "none", stroke: "var(--line)", "stroke-width": stroke }));
        if (frac > 0) s.append(svg("circle", {
          cx: mid, cy: mid, r, fill: "none", stroke: met ? "var(--good)" : "var(--accent)", "stroke-width": stroke,
          "stroke-linecap": "round", "stroke-dasharray": `${c * Math.min(frac, 1)} ${c}`, transform: `rotate(-90 ${mid} ${mid})`,
        }));
        s.append(svg("text", { x: mid, y: mid, "text-anchor": "middle", "dominant-baseline": "central", class: "ring-text" + (big ? " big" : "") }, label));
        return s;
      }

      function barChart(counts, days, goal) {
        const max = Math.max(goal || 0, ...counts, 1);
        const bars = el("div", "bars");
        counts.forEach((n, i) => {
          const col = el("div", "bar-col");
          col.title = `${dayKeyDate(days[i]).toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" })}: ${n}`;
          const bar = el("div", "bar" + (i === counts.length - 1 ? " today" : ""));
          bar.style.height = `${(n / max) * 100}%`;
          col.append(bar);
          bars.append(col);
        });
        if (goal) {
          const line = el("div", "goal-line");
          line.style.bottom = `${(goal / max) * 100}%`;
          line.title = `Goal: ${goal} a day`;
          bars.append(line);
        }
        const labels = el("div", "bar-labels", days.map((d, i) =>
          el("span", null, i === days.length - 1 ? "Today" : dayKeyDate(d).toLocaleDateString([], { weekday: "narrow" }))));
        return el("div", null, bars, labels);
      }

      function weightChart(points, unit) {
        const W = 320, H = 150, L = 34, R = 12, T = 22, B = 20;
        const ts = points.map(p => +new Date(p.t)), vs = points.map(p => p.v);
        let t0 = Math.min(...ts), t1 = Math.max(...ts);
        if (t0 === t1) { t0 -= 7 * DAY; t1 += 7 * DAY; }
        let v0 = Math.min(...vs), v1 = Math.max(...vs);
        const padV = Math.max((v1 - v0) * 0.15, 1);
        v0 = Math.floor(v0 - padV); v1 = Math.ceil(v1 + padV);
        const x = t => L + (t - t0) / (t1 - t0) * (W - L - R);
        const y = v => T + (1 - (v - v0) / (v1 - v0)) * (H - T - B);
        const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", role: "img",
          "aria-label": `Weight over time; latest ${vs[vs.length - 1]} ${unit}` });
        [v0, v1].forEach(v => {
          s.append(svg("line", { x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: "var(--line)", "stroke-width": 1 }));
          s.append(svg("text", { x: L - 6, y: y(v), "text-anchor": "end", "dominant-baseline": "central", class: "axis" }, v));
        });
        s.append(svg("text", { x: L, y: H - 4, class: "axis" }, shortDate(ts[0])));
        if (ts.length > 1) s.append(svg("text", { x: W - R, y: H - 4, "text-anchor": "end", class: "axis" }, shortDate(ts[ts.length - 1])));
        if (points.length > 1) {
          s.append(svg("polyline", { points: points.map((p, i) => `${x(ts[i])},${y(p.v)}`).join(" "), fill: "none",
            stroke: "var(--accent)", "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
        }
        points.forEach((p, i) => s.append(svg("g", {},
          svg("title", {}, `${dateOf(p.t)}: ${p.v} ${unit}`),
          svg("circle", { cx: x(ts[i]), cy: y(p.v), r: 11, fill: "transparent" }),
          svg("circle", { cx: x(ts[i]), cy: y(p.v), r: 4, fill: "var(--accent)", stroke: "var(--card)", "stroke-width": 2 }))));
        const li = points.length - 1;
        s.append(svg("text", { x: Math.min(x(ts[li]) + 4, W - R), y: y(points[li].v) - 10, "text-anchor": "end", class: "axis",
          style: "fill: var(--ink); font-weight: 600" }, `${points[li].v} ${unit}`));
        return s;
      }

      function heatmap(days, counts, todayKey) {
        const max = Math.max(...counts, 1);
        const lead = dayKeyDate(days[0]).getDay();
        const grid = el("div", "heat");
        grid.style.gridTemplateColumns = `repeat(${Math.ceil((lead + days.length) / 7)}, 1fr)`;
        for (let i = 0; i < lead; i++) grid.append(el("div", "blank"));
        days.forEach((d, i) => {
          const n = counts[i];
          const level = n === 0 ? 0 : Math.max(1, Math.ceil((n / max) * 4));
          const cell = el("div", [level ? "l" + level : "", d === todayKey ? "today" : ""].join(" ").trim());
          cell.title = `${dayKeyDate(d).toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" })}: ${plural(n, "log")}`;
          grid.append(cell);
        });
        const legend = el("div", "legend", "Less", [0, 1, 2, 3, 4].map(l => { const i = el("i"); i.style.background = `var(--heat-${l})`; return i; }), "More");
        return el("div", null, grid, legend);
      }

      // ---------- sections ----------
      const section = (title, ...kids) => [el("h2", null, title), ...kids.flat()];
      const card = (...kids) => el("div", "card", ...kids);
      const emptyCard = text => card(el("div", "empty", text));
      const row = (emoji, line, detail, side) => el("li", null,
        emoji ? el("span", "emoji", emoji) : null,
        el("div", "body", el("div", "line", line), detail ? el("div", "detail", detail) : null),
        side == null ? null : side instanceof Node ? side : el("div", "side", side));

      function renderProfile(d) {
        const p = d.pet;
        let photo = el("div", "photo", "🐶");
        if (p.photo) {
          const img = el("img", "photo");
          img.alt = `Photo of ${p.name}`;
          img.onerror = () => img.replaceWith(el("div", "photo", "🐶"));
          img.src = p.photo;
          photo = img;
        }
        const meta = [];
        if (p.breed) meta.push(p.breed);
        let bday = null;
        if (/^\d{4}-\d{2}-\d{2}$/.test(p.birthday)) {
          const born = dayKeyDate(p.birthday), today = new Date();
          today.setHours(0, 0, 0, 0);
          let months = (today.getFullYear() - born.getFullYear()) * 12 + today.getMonth() - born.getMonth();
          if (today.getDate() < born.getDate()) months--;
          const yrs = Math.floor(months / 12), mos = months % 12;
          meta.push(yrs ? `${plural(yrs, "year")}${mos ? `, ${plural(mos, "month")}` : ""} old` : `${plural(Math.max(mos, 0), "month")} old`);
          let next = new Date(today.getFullYear(), born.getMonth(), born.getDate());
          if (next < today) next = new Date(today.getFullYear() + 1, born.getMonth(), born.getDate());
          const n = Math.round((next - today) / DAY);
          const turning = next.getFullYear() - born.getFullYear();
          bday = n === 0 ? `🎂 Happy birthday, ${p.name}! ${turning} today` : `🎂 Turns ${turning} in ${plural(n, "day")}`;
        }
        const who = el("div", "who", el("h1", null, p.name),
          meta.length ? el("div", "meta", meta.join(" · ")) : null,
          bday ? el("div", "bday", bday) : null);
        const score = d.today.score == null ? null : el("div", "score",
          ring(d.today.score / 100, 72, 8, d.today.score >= 100, `${d.today.score}%`, true),
          el("div", "label", "Day score"));
        return card(el("div", "profile", photo, who, score));
      }

      function renderToday(d, A) {
        const out = [];
        if (d.today.goals.length) {
          out.push(el("div", "rings", d.today.goals.map(g => {
            const a = A[g.key], met = g.count >= g.goal, last = d.today.last[g.key];
            return el("div", "ring-tile",
              ring(g.count / g.goal, 64, 7, met, `${g.count}/${g.goal}`),
              el("div", "name", `${a.emoji} ${a.name}`),
              el("div", "sub", met ? "✓ Goal met" : last ? `Last ${ago(last.t)}` : "Not yet"));
          })));
        }

        out.push(el("h2", null, "Time since last"));
        out.push(card(el("ul", "rows", d.actions.filter(a => a.group === "daily").map(a => {
          const last = d.today.last[a.key];
          return row(a.emoji, a.name, last ? [last.who, last.option].filter(Boolean).join(" · ") : "", last ? ago(last.t) : "Never");
        }))));

        out.push(el("h2", null, "Today's timeline"));
        out.push(d.today.timeline.length
          ? card(el("ul", "rows", d.today.timeline.map(item => {
              const detail = [item.option, amountText(item.amount, item.unit), item.due ? `next due ${dateOf(item.due)}` : "", quoted(item.note)]
                .filter(Boolean).join(" · ");
              const t = el("time", "side", timeOf(item.t));
              t.dateTime = item.t;
              return row(item.emoji, `${item.who} ${item.label}`, detail, t);
            })))
          : emptyCard(`Nothing logged for ${d.pet.name} yet today.`));
        return section("Today", out);
      }

      function renderHealth(d) {
        const h = d.health, out = [];

        const meds = card(el("h3", null, "💊 Medications & preventatives"));
        if (!h.meds.schedule.length && !h.meds.history.length) {
          meds.append(el("div", "empty", "No medications logged yet — add one in Quick Log."));
        } else {
          if (h.meds.schedule.length) meds.append(el("ul", "rows", h.meds.schedule.map(m => row(null, m.name,
            m.last
              ? `Last given ${shortDate(m.last.t)} by ${m.last.who}${m.last.amount !== "" ? ` · ${m.last.amount}` : ""} · every ${plural(m.every, "day")}`
              : `Not logged yet · every ${plural(m.every, "day")}`,
            m.nextDue ? dueBadge(m.nextDue, 7) : null))));
          if (h.meds.history.length) meds.append(el("details", null,
            el("summary", null, `Medication history (${h.meds.history.length})`),
            el("ul", "rows", h.meds.history.map(r => row(null, r.option || "Medication",
              [r.who, r.amount, quoted(r.note)].filter(Boolean).join(" · "), shortDate(r.t))))));
        }
        out.push(meds);

        out.push(card(el("h3", null, "💉 Vaccinations"), h.vaccines.length
          ? el("ul", "rows", h.vaccines.map(v => row(null, v.name,
              [`Given ${dateOf(v.given)}`, v.who, quoted(v.note)].filter(Boolean).join(" · "),
              v.due ? dueBadge(v.due, h.vaccineWarnDays) : el("span", "badge", "No due date"))))
          : el("div", "empty", "No vaccinations logged yet — add one in Quick Log.")));

        const w = h.weight, wc = card(el("h3", null, "⚖️ Weight"));
        if (!w.points.length) {
          wc.append(el("div", "empty", "No weight logged yet — add one in Quick Log."));
        } else {
          const lastP = w.points[w.points.length - 1], first = w.points[0];
          const diff = Math.round((lastP.v - first.v) * 10) / 10;
          wc.append(el("div", "small muted", `${lastP.v} ${w.unit} on ${dateOf(lastP.t)}` +
            (w.points.length > 1 ? ` · ${diff > 0 ? "+" : ""}${diff} ${w.unit} since ${dateOf(first.t, { month: "short", year: "numeric" })}` : "")));
          wc.append(weightChart(w.points, w.unit));
        }
        out.push(wc);

        out.push(card(el("h3", null, "🩺 Vet visits"), h.vet.length
          ? el("ul", "rows", h.vet.map(r => row(null, r.option || "Visit", [r.who, quoted(r.note)].filter(Boolean).join(" · "), dateOf(r.t))))
          : el("div", "empty", "No vet visits logged yet — add one in Quick Log.")));

        out.push(card(el("h3", null, "🤒 Symptoms & health notes"), h.symptoms.length
          ? el("ul", "rows", h.symptoms.map(r => row(null, r.option || "Symptom", [r.who, quoted(r.note)].filter(Boolean).join(" · "),
              `${shortDate(r.t)}, ${timeOf(r.t)}`)))
          : el("div", "empty", "No symptoms logged — add one in Quick Log if something seems off.")));
        return section("Health", out);
      }

      function renderGrooming(d) {
        if (!d.grooming.length) return section("Grooming", emptyCard("No grooming choices set up yet — add them in Config.gs."));
        return section("Grooming", card(el("ul", "rows", d.grooming.map(g => {
          const since = g.last ? -daysUntil(g.last.t) : null;
          return row(null, g.name,
            g.last ? `Last done ${since === 0 ? "today" : `${plural(since, "day")} ago`} · ${g.last.who}` : "Not logged yet — add one in Quick Log",
            g.nextDue ? dueBadge(g.nextDue, 3) : g.every ? el("span", "badge", `Every ${plural(g.every, "day")}`) : null);
        }))));
      }

      function renderSupplies(d) {
        if (!d.supplies.length) return [];
        return section("Supplies", d.supplies.map(s => {
          const c = card(el("h3", null, s.label));
          if (s.status === "no-bag-size") {
            c.append(el("div", "empty", `Set the ${s.label.toLowerCase()} bag size in Config.gs to track what's left.`));
          } else if (s.status === "never-opened") {
            c.append(el("div", "empty", `Log “${s.openedBy}” in Quick Log when you open the next bag to start tracking.`));
          } else {
            const pct = Math.round((s.remaining / s.bagSize) * 100);
            const meter = el("div", "meter" + (s.warn ? " warn" : ""), el("div"));
            meter.firstChild.style.width = `${pct}%`;
            meter.setAttribute("role", "img");
            meter.setAttribute("aria-label", `${pct}% left`);
            c.append(el("div", "small", el("strong", "num", `~${s.remaining} ${s.unit}`), ` left of ${s.bagSize} (${pct}%)`),
              meter,
              el("div", "tiny muted", `Opened ${shortDate(s.openedAt)} by ${s.openedWho}` +
                (s.daysLeft != null ? ` · about ${plural(s.daysLeft, "day")} left at this pace` : "")));
            if (s.warn) c.append(el("div", null, el("span", "badge warn", "⚠️", "Restock soon")));
          }
          return c;
        }));
      }

      function renderTrends(d, A) {
        const t = d.trends, out = [];
        out.push(el("div", "stats",
          el("div", "stat", el("div", "big", `${t.streak.current}${t.streak.capped ? "+" : ""}`),
            el("div", "label", `day streak hitting every goal${t.streak.todayMet ? " (incl. today)" : ""}`)),
          el("div", "stat", el("div", "big", d.trackingSince ? dateOf(d.trackingSince, { month: "short", year: "numeric" }) : "—"),
            el("div", "label", "tracking since"))));

        out.push(el("h2", null, "Last 7 days"));
        out.push(el("div", "multiples", t.bars.map(b => {
          const a = A[b.key];
          return el("div", "mini",
            el("div", "head", el("span", null, `${a.emoji} ${a.name}`), el("span", "muted num", `${b.counts.reduce((s, n) => s + n, 0)} total`)),
            barChart(b.counts, t.days7, a.goal));
        })));

        out.push(el("h2", null, "This week vs last week"));
        const table = el("table", null, el("tr", null, el("th"), el("th", "r", "Last 7 days"), el("th", "r", "Week before"), el("th", "r", "Change")));
        t.weekVsWeek.forEach(w => {
          const a = A[w.key], delta = w.thisWeek - w.lastWeek;
          table.append(el("tr", null, el("td", null, `${a.emoji} ${a.name}`), el("td", "r num", w.thisWeek), el("td", "r num", w.lastWeek),
            el("td", "r num muted", delta === 0 ? "same" : `${delta > 0 ? "▲" : "▼"} ${Math.abs(delta)}`)));
        });
        out.push(card(table));

        out.push(el("h2", null, "Activity, last 13 weeks"));
        out.push(card(heatmap(t.heatmap.days, t.heatmap.counts, d.todayKey),
          el("div", "tiny muted", `${shortDate(dayKeyDate(t.heatmap.days[0]))} – today · ${plural(t.heatmap.counts.reduce((s, n) => s + n, 0), "log")}`)));

        if (t.usualTimes.length) {
          out.push(el("h2", null, "Usual times · last 14 days"));
          out.push(card(el("ul", "rows", t.usualTimes.map(u => row(A[u.key].emoji, A[u.key].name,
            u.times.length ? u.times.map(minutesToTime).join(" · ") : `Needs a few more days of logs (${plural(u.samples, "log")} so far)`)))));
        }

        out.push(el("h2", null, "All-time totals"));
        const logged = t.totals.filter(x => x.count > 0);
        out.push(card(logged.length
          ? el("table", null, logged.map(x => el("tr", null, el("td", null, `${A[x.key].emoji} ${A[x.key].name}`), el("td", "r num", x.count.toLocaleString()))))
          : el("div", "empty", "Nothing logged yet.")));
        return section("Trends", out);
      }

      function render(d) {
        const A = {};
        d.actions.forEach(a => { A[a.key] = a; });
        document.title = `${d.pet.name} · PupLog`;
        document.getElementById("app").replaceChildren(
          renderProfile(d),
          ...renderToday(d, A),
          ...renderHealth(d),
          ...renderGrooming(d),
          ...renderSupplies(d),
          ...renderTrends(d, A),
          el("footer", null, `PupLog · updated ${timeOf(d.generatedAt)}`));
      }

      // ---------- data ----------
      async function load() {
        const key = getViewKey();
        const status = document.getElementById("status");
        try {
          const res = await fetch(`${SCRIPT_URL}?route=dashboard${key ? `&key=${encodeURIComponent(key)}` : ""}`);
          const data = await res.json();
          if (data.error === "unauthorized") {
            store(() => localStorage.removeItem(STORE));
            status.textContent = "This dashboard is private. Open your family link to see it.";
            document.getElementById("app").replaceChildren();
            return;
          }
          render(data);
          status.textContent = "";
        } catch (e) {
          status.textContent = "Couldn't reach PupLog. Try again in a minute.";
        }
      }

      load();
      setInterval(() => { if (!document.hidden) load(); }, REFRESH_MS);
      document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
    </script>
  </body>
</html>
